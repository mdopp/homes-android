# The live widgets on real Android (emulators): the proof Robolectric cannot
# give — foreground-service start rules, a killed process, a real reboot.
# e2e/live_e2e.sh has the steps; e2e/fake_homes.py stands in for Homes.
name: live-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1' # weekly, Monday morning
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/cloud/dopp/homes/realtime/**'
      - 'app/src/main/java/cloud/dopp/homes/widget/**'
      - 'app/src/main/java/cloud/dopp/homes/konto/**'
      - 'app/src/main/java/cloud/dopp/homes/sicherung/Handy.kt'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/androidTest/**'
      - 'e2e/**'
      - '.github/workflows/live-e2e.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      # A throwaway CA, made here and gone with the runner; the debug-only trust in it.
      - name: Throwaway CA
        run: bash e2e/make_ca.sh e2e/out

      - name: Build the app and its e2e setup
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Start the fake Homes
        run: |
          nohup python3 e2e/fake_homes.py --port 8443 --cert e2e/out/server.pem --key e2e/out/server.key --log homes.log > fake_homes.out 2>&1 &
          for i in $(seq 1 20); do curl -sk https://127.0.0.1:8443/ctl/streams && break; sleep 0.5; done

      - name: AVD cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-google_apis-x86_64

      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot for the cache"

      - name: Live e2e
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          HOMES_LOG: homes.log
          E2E_OUT: e2e-out
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash e2e/live_e2e.sh

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-e2e-api-${{ matrix.api-level }}
          path: |
            homes.log
            fake_homes.out
            e2e-out/
          if-no-files-found: warn
