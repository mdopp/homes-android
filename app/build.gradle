plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // The code gates (CLAUDE.md "Code gates"): unused code, complexity, smells.
    id 'io.gitlab.arturbosch.detekt' version '1.23.8'
}

android {
    compileSdkVersion 36
    namespace "cloud.dopp.homes"
    defaultConfig {
        // A new app (laib ADR 0022 §1): its own id, nothing carried from the old one.
        applicationId "cloud.dopp.homes"
        // Phase 3 raised 21 → 23: EncryptedSharedPreferences (Jetpack Security)
        // needs the AndroidKeyStore-backed master key from API 23.
        minSdkVersion 23
        targetSdkVersion 35
        // CI sets both (#182): the code is the workflow's run number, so every
        // build installs over the one before it, dev and tag alike; the name is
        // the tag, or the next patch with -dev.<run> for a build of main.
        versionCode(Integer.parseInt(System.getenv("HOMES_VERSION_CODE") ?: "1"))
        versionName(System.getenv("HOMES_VERSION_NAME") ?: "0.0.0-local")
        // The box's public host for the tags' App Link (homes ADR 0004 §5, `HOMES_PUBLIC_URL`'s host):
        // Android verifies an App Link only for a host the manifest names, so it is set at build time.
        // The default is the owner's box; another box builds with -PhomesHost=<host> or HOMES_APP_HOST.
        // Its tags work without it too: they open Homes' page in the browser.
        manifestPlaceholders = [homesHost: System.getenv("HOMES_APP_HOST") ?: project.findProperty("homesHost") ?: "www.dopp.cloud"]
        // The live e2e on emulators (e2e/, .github/workflows/live-e2e.yml).
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            // Populated from env (CI secrets / local signed builds). When unset,
            // assembleRelease produces an unsigned APK — no hardcoded keystore.
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "haus"
                keyPassword(System.getenv("ANDROID_KEY_PASSWORD")
                        ?: System.getenv("ANDROID_KEYSTORE_PASSWORD"))
            }
        }
    }
    buildTypes {
        release {
            // Disabled during native development so R8 doesn't strip
            // reflection-referenced classes. Re-enable with keep rules before Play.
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // The code gates (CLAUDE.md "Code gates"): every warning fails, except what
    // lint-baseline.xml lists from before the gate; scripts/ratchet.sh asks to
    // shrink it when an entry is fixed.
    lint {
        checkReleaseBuilds false
        abortOnError true
        warningsAsErrors true
        baseline file('lint-baseline.xml')
        // off by default; a layout id nothing reads is dead weight too
        enable += ['UnusedIds']
        // the ratchet: a baseline entry that no longer matches fails, so the
        // baseline shrinks in the PR that fixed it
        error += ['LintBaselineFixed']
        // these change with the calendar, not with the code: a new library or
        // SDK release would turn a green commit red
        disable += ['GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion',
                    'OldTargetApi']
        xmlReport true
        textReport true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

// The code gates (CLAUDE.md "Code gates"): config/detekt.yml on top of detekt's
// defaults; detekt-baseline.xml holds what was there before the gate.
detekt {
    toolVersion = '1.23.8'
    buildUponDefaultConfig = true
    config.setFrom(rootProject.file('config/detekt.yml'))
    baseline = file('detekt-baseline.xml')
    source.setFrom('src/main/java', 'src/test/java', 'src/androidTest/java')
    parallel = true
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    // --- Widgets and pairing ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // The level sheet's BottomSheetDialog and Slider (owner, 2026-11-03)
    implementation 'com.google.android.material:material:1.12.0'
    // Custom Tabs for pairing (/pair-device): it shares the browser's Authelia session.
    implementation 'androidx.browser:browser:1.8.0'
    // Encrypted-at-rest storage for the homes_device_… bearer token.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // Read JPEG EXIF orientation so camera captures are rotated upright (#67).
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    // Networking for the widget data/action calls.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Server-Sent Events client for the live stream, held while the screen is on (#176).
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    // Self-contained QR scanner for onboarding (no Google Play Services).
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Nachrichten sichern (#194): the one background job, daily on WLAN while charging.
    implementation 'androidx.work:work-runtime:2.10.0'
    // SMS und Anrufe (laib ADR 0029): age-encrypted on the phone. BouncyCastle's
    // lightweight X25519, HKDF, HMAC and ChaCha20-Poly1305 (Android has the last
    // two only from API 28/33); the jdk15to18 build has no multi-release classes.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'

    // JVM tests (Robolectric — runs Android components on the JVM, no emulator/VM).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
    // A fake Homes for the resumable upload (#194), and WorkManager in tests.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'androidx.work:work-testing:2.10.0'

    // The live e2e's setup on the emulator: pair and place widgets (e2e/live_e2e.sh).
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
